<?xml version="1.0" encoding="UTF-8"?>
<svg width="520" height="720" viewBox="0 0 520 720" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Renewal Serum">
  <defs>
    <linearGradient id="liq" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e8c98a"/>
      <stop offset="1" stop-color="#b9863f"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.22"/>
    </linearGradient>
    <linearGradient id="cap" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e6cf9a"/>
      <stop offset="1" stop-color="#3c2f1c"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.5" cy="0.42" r="0.62">
      <stop offset="0" stop-color="#d8b26a" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#d8b26a" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
  </defs>

  <ellipse cx="260" cy="360" rx="220" ry="300" fill="url(#halo)"/>

  <!-- Bottle body -->
  <g>
    <rect x="150" y="250" width="220" height="380" rx="34" fill="url(#liq)"/>
    <rect x="150" y="250" width="220" height="380" rx="34" fill="url(#glass)"/>
    <rect x="150" y="250" width="220" height="380" rx="34" fill="none" stroke="#ffffff" stroke-opacity="0.5" stroke-width="1.5"/>
    <!-- liquid line -->
    <rect x="150" y="330" width="220" height="300" rx="34" fill="#b9863f" fill-opacity="0.28"/>
    <!-- highlight -->
    <rect x="176" y="280" width="26" height="320" rx="13" fill="#ffffff" fill-opacity="0.35"/>
    <rect x="330" y="300" width="12" height="150" rx="6" fill="#ffffff" fill-opacity="0.18"/>
  </g>

  <!-- Shoulder / neck -->
  <path d="M210 250 q50 -34 100 0 z" fill="url(#glass)"/>
  <rect x="228" y="196" width="64" height="64" rx="10" fill="url(#glass)" stroke="#ffffff" stroke-opacity="0.4"/>

  <!-- Cap -->
  <rect x="214" y="120" width="92" height="86" rx="14" fill="url(#cap)"/>
  <rect x="214" y="120" width="92" height="20" rx="10" fill="#ffffff" fill-opacity="0.35"/>
  <rect x="222" y="206" width="76" height="10" rx="5" fill="#3c2f1c"/>

  <!-- Emblem -->
  <g transform="translate(260 430)" opacity="0.9">
    <path d="M-26 -34 C 14 -14 -14 14 26 34" stroke="#e6cf9a" stroke-width="4" fill="none" stroke-linecap="round"/>
    <path d="M26 -34 C -14 -14 14 14 -26 34" stroke="#e6cf9a" stroke-width="4" fill="none" stroke-linecap="round"/>
    <line x1="-18" y1="-22" x2="18" y2="-22" stroke="#e6cf9a" stroke-width="2.5" opacity="0.7"/>
    <line x1="-22" y1="0" x2="22" y2="0" stroke="#e6cf9a" stroke-width="2.5" opacity="0.7"/>
    <line x1="-18" y1="22" x2="18" y2="22" stroke="#e6cf9a" stroke-width="2.5" opacity="0.7"/>
  </g>
  <text x="260" y="560" text-anchor="middle" font-family="Georgia, serif" font-size="15" letter-spacing="3" fill="#e6cf9a" opacity="0.85">CHROMOSOME</text>
</svg>